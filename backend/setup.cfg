[flake8]
max-line-length = 100
exclude = .git,__pycache__,env,venv,build,dist
ignore = E501,E402,E712,W503

[pylint]
max-line-length = 100
disable = W1203, C0114, C0115, C0116, C0301
init-hook='import sys; sys.path.append("backend")'

[tool:pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

[isort]
profile = black
line_length = 100
filter_files = true