<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Audit Agent Report</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta charset="utf-8" />
    <link href="./css/base.css" rel="stylesheet" />
    <link href="./css/components.css" rel="stylesheet" />
    <link href="./css/typography.css" rel="stylesheet" />
    <!-- Add other necessary meta tags and links -->
  </head>
  <body>
    <div class="a4-container">
      <div class="report-container">
        <div class="report-content">
          <div class="report-section">
            <!-- INFO SECTION -->
            <div class="info-section">
              <div class="section-header">
                <span class="section-title textSmleading-5fontMedium">
                  <span>Code Info</span>
                </span>
              </div>
              <div class="section-content">
                <!-- Row 1 -->
                <div class="info-row">
                  <div class="info-column">
                    <div class="info-text">
                      <img
                        alt="isIconOnly2571"
                        class="info-icon"
                        src="public/organization_icon.svg"
                      />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label">Organization</span>
                          <span class="info-value textSmleading-5fontMedium"
                            ><!--organization--></span
                          >
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="divider"></div>

                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/scan_id_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal">Scan ID</span>
                          <span class="info-value textSmleading-5fontMedium"><!--scanId--></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="horizontal-divider"></div>

                <!-- Row 2 -->
                <div class="info-row">
                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/repository_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal">Repository</span>
                          <span class="info-value textSmleading-5fontMedium"
                            ><!--repository--></span
                          >
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="divider"></div>

                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/repository_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal">Branch</span>
                          <span class="info-value textSmleading-5fontMedium"><!--branch--></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="horizontal-divider"></div>

                <!-- Row 3 -->
                <div class="info-row">
                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/contracts_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal"
                            >Contracts in scope</span
                          >
                          <span class="info-value textSmleading-5fontMedium"
                            ><!--contracts_files--></span
                          >
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- CODE STATISTICS SECTION -->
            <div class="info-section">
              <div class="section-header">
                <span class="section-title textSmleading-5fontMedium">
                  <span>Code Statistics</span>
                </span>
              </div>
              <div class="section-content">
                <div class="info-row">
                  <!-- Findings -->
                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/bug_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal">Findings</span>
                          <span class="info-value textSmleading-5fontMedium"
                            ><!--vulnerabilties_found--></span
                          >
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="divider"></div>

                  <!-- Contracts Scanned -->
                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/contracts_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal"
                            >Contracts Scanned</span
                          >
                          <span class="info-value textSmleading-5fontMedium"
                            ><!--Contracts_Scanned--></span
                          >
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="divider"></div>

                  <!-- Lines of Code -->
                  <div class="info-column">
                    <div class="info-text">
                      <img alt="VectorI257" class="info-icon" src="public/loc_icon.svg" />
                      <div class="info-column">
                        <div class="info-text column">
                          <span class="info-label textSmleading-5fontNormal">Lines of Code</span>
                          <span class="info-value textSmleading-5fontMedium"><!--LoC--></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- CODE SUMMARY SECTION -->
            <div class="info-section">
              <div class="section-header">
                <span class="section-title textSmleading-5fontMedium">
                  <span>Code Summary</span>
                </span>
              </div>
              <div class="section-content">
                <span class="description-text textSmleading-5fontNormal">
                  <!--summary-->
                </span>
              </div>
            </div>
            <!--findings-->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
