version: '3.8'

services:
  backend:
    # Build the backend container using the Dockerfile located at ./backend/Dockerfile
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: backend  # Name of the backend container
    ports:
      - "8000:8000"  # Expose port 8000 for the backend service
    networks:
      - auditor-network  # Connect to the custom app network
    env_file:
      - ./backend/.env  # Load environment variables from the .env file
    depends_on:
      - frontend  # Ensure the frontend service starts first

  frontend:
    # Build the frontend container using the Dockerfile located at ./frontend/Dockerfile
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: frontend  # Name of the frontend container
    ports:
      - "3000:3000"  # Expose port 3000 for the frontend service
    networks:
      - auditor-network  # Connect to the custom app network
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000  # API URL pointing to the backend
    depends_on:
      - backend  # Ensure the backend service starts first

# Define a custom network so both containers can communicate with each other
networks:
  auditor-network:
    driver: bridge
