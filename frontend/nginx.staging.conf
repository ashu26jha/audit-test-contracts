worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define upstream for Next.js
    upstream nextjs_upstream {
        server localhost:3000;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;  # 5 requests per second
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;  # 10 requests per second

    # Enable auto-ban for too many failed attempts
    limit_req_status 429;  # Return 429 Too Many Requests instead of 503
    
    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;
        server_name _;

        # Proxy settings for WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Block common exploit scanning paths
        location ~ (/\.env|\.git|wp-admin|wp-login|administrator|admin|phpmyadmin|xmlrpc) {
            deny all;
            return 404;
        }

        # Protect sensitive files
        location ~ /\.(?:env|git|htpasswd|secrets\.yml) {
            deny all;
        }

        # API rate limiting
        location ~ ^/api(/|$) {
            limit_req zone=api_limit burst=10 nodelay;  # Allow burst of 10 requests
            limit_req_status 429;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            auth_basic off; # Disable Basic Auth for serverside routes
        }

        # Default location with rate limiting and auth
        location / {
            limit_req zone=general_limit burst=20;  # Allow burst of 20 requests

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable Basic Auth for staging
            auth_basic "Restricted Content";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # Health check endpoint remains accessible
        location /health {
            return 200 'ok';
        }

        # Return 429 Too Many Requests when rate limit is exceeded
        error_page 429 /too_many_requests.html;
        location = /too_many_requests.html {
            internal;
            return 429 '{"error": "Too many requests. Please try again later."}';
        }
    }
} 