name: Build and Push Frontend image on jfrog 

on:
  push:
    branches:
      - staging

env:
  DOCKER_REGISTRY: nethermind.jfrog.io
  JFROG_REPOSITORY: kyoto-oci-local-staging
  AGENT_NAME: code-auditor-frontend
  NEXT_PUBLIC_API_URL: https://api.auditagent.staging-nethermind.xyz
  NEXT_PUBLIC_GITHUB_APP_URL: https://github.com/apps/auditagent-staging/installations/new


permissions:
  id-token: write
  contents: write

jobs:
  push-frontend-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Verify ORAS version
        run: oras version

      - name: Install Apache2-utils (for htpasswd)
        run: sudo apt-get install -y apache2-utils

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.ARTIFACTORY_KYOTO_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_KYOTO_TOKEN_DEVELOPER }}

      - name: Login to registry with ORAS
        run: |
          oras login ${{ env.DOCKER_REGISTRY }} \
            -u ${{ secrets.ARTIFACTORY_KYOTO_USERNAME }} \
            -p ${{ secrets.ARTIFACTORY_KYOTO_TOKEN_DEVELOPER }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: "linux/amd64"
          push: true
          file: ./frontend/Dockerfile.frontend.staging
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.JFROG_REPOSITORY }}/${{ env.AGENT_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.JFROG_REPOSITORY }}/${{ env.AGENT_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GITHUB_APP_URL=${{ env.NEXT_PUBLIC_GITHUB_APP_URL }}
