name: Code Quality Checks

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

# Ensure only one workflow runs at a time per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set default permissions
permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: 'development'
      ADMIN_API_KEY: 'test-admin-api-key'
      OPENAI_API_KEY: 'test-openai-api-key'
      GEMINI_API_KEY: 'test-gemini-api-key'
      ANTHROPIC_API_KEY: 'test-anthropic-api-key'
      MONGODB_URL: 'mongodb://localhost:27017/testdb'
      SECRET_KEY: 'test-secret-key'
      GITHUB_CLIENT_ID: 'testclientid'
      GITHUB_CLIENT_SECRET: 'testclientsecret'
      STRIPE_API_KEY: 'teststripeapikey'
      STRIPE_WEBHOOK_SECRET: 'teststripewebhooksecret'
      ETHERSCAN_API_KEY: 'testetherscanapikey'
      SMTP_SERVER: 'test.smtp.server'
      SMTP_PORT: '587'
      SMTP_USERNAME: 'test_username'
      SMTP_PASSWORD: 'test_password'
    steps:
    - uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.0'

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.dev.txt

    - name: Run Black
      run: black --check --line-length=100 .

    - name: Run isort
      run: isort --check-only --settings-path=setup.cfg .

    - name: Run flake8
      run: flake8 --config=setup.cfg

    - name: Run Tests
      run: pytest
      env:
        CI: "true"  # This will set VCR to 'none' mode
        VCR_RECORD_MODE: "none"  # Explicit setting for VCR

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.19.0'
    - name: Install dependencies
      run: npm install --no-package-lock
    - name: Run ESLint
      run: npm run lint
    - name: Run Prettier
      run: npm run prettier -- --check .