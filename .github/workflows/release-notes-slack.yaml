name: Post Release Notes to Slack

on:
  release:
    types: [published]

jobs:
  post-to-slack:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Transform and send release notes with Python
        env:
          RELEASE_BODY: "${{ github.event.release.body }}"
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
          RELEASE_URL: "${{ github.event.release.html_url }}"
          REPO_FULL_NAME: "${{ github.repository }}"
        run: |
          echo "Release Tag: ${RELEASE_TAG}"
          echo "Original Body:"
          echo "${RELEASE_BODY}"
          
          cat > process_release.py << 'EOL'
          import os, re, json

          body = os.environ.get('RELEASE_BODY', '')
          tag_name = os.environ.get('RELEASE_TAG', '')
          url = os.environ.get('RELEASE_URL', '')
          repo_full_name = os.environ.get('REPO_FULL_NAME', '')

          body = body.replace('\r', '')

          # Parsing for conversion from .md to slack support messages
          body = re.sub(r'^### (.*)', r'\n*\1*', body, flags=re.MULTILINE)
          body = re.sub(r'[[:space:]]### (.*)', r'\n*\1*', body, flags=re.MULTILINE)
          body = re.sub(r'^\* ', r'• ', body, flags=re.MULTILINE)
          body = re.sub(r'^  - ', r'    • ', body, flags=re.MULTILINE)

          # Link parsing goes here
          body = re.sub(r'\[(#[0-9]+)\]\([^)]*\)', r'\1', body)
          body = re.sub(r'#([0-9]+)', r'<https://github.com/' + repo_full_name + r'/pull/\1|\1>', body)
          body = re.sub(r'\*\*(.+?)\*\*', r'*\1*', body)

          # Build the Slack payload
          payload = {
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"🚀 *New Release:* {tag_name}\n\n{body}\n\n<{url}|View Release on GitHub>"
                      }
                  }
              ]
          }

          print(json.dumps(payload))
          EOL
          
          # Run the Python script and save output to a file
          python process_release.py > payload.json
          
          echo "Payload:"
          cat payload.json
          RESPONSE=$(curl -v -X POST -H "Content-Type: application/json" --data @payload.json "$SLACK_WEBHOOK_URL")
          echo "Slack Response: $RESPONSE"